<!-- ==================== 상단바(고정) ====================
     - 좌: 로고
     - 우: 사용자 상태 칩(아바타 + 이름)
     - 연결: .chip 클릭 → 마이페이지 이동 등
-->
<header class="topbar" role="banner">
  <div class="row">
    <!-- 서비스 로고: 프로젝트 자산 경로 확인 필요 -->
    <div class="logo" aria-label="아이-고 홈">
      <img src="img/ai_go_logo.png" class="logo-img">
      <span>아이-고</span>
    </div>
  </div>

  <!-- 사용자 칩: 아바타(이니셜) + 이름 / 클릭 시 마이페이지 이동 가능 -->
  <div class="chip" id="userChip" role="button" aria-label="내 정보" style="display: none !important;">
    <span class="avatar" aria-hidden="true" id="userAvatar"></span>
    <span id="userName"></span>
  </div>
</header>

<style>
/* ==================== 상단바(Topbar) ==================== */
.topbar{
  /* 상단 고정, 안전영역 고려 */
  padding: 16px var(--container-padding);
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  background: #fff; 
  border-bottom: 1px solid var(--line);
  position: sticky; /* 스크롤해도 상단 고정 */
  top: 0;
  z-index: 10;        /* 콘텐츠 위에 노출 */
  flex-wrap: nowrap;
  gap: 16px;
  min-height: 60px;
}

@media (max-width: 480px) {
  .topbar {
    gap: 8px;
    padding: 12px var(--container-padding);
  }
  
  .topbar .row {
    gap: 8px;
  }
  
  .topbar .chip {
    gap: 8px;
    padding: 6px 12px;
  }
}

.topbar .row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink: 0;
  min-width: 0;
}

.topbar .logo{
  display:flex;
  align-items:flex-end;
  gap:8px;
  font-size:22px;
  font-weight:800;
  color:var(--text);
}

.logo{
  display:flex;
  align-items:flex-end;
  gap:8px;
  font-weight:900;
  font-size:22px;
  color:var(--text);
}

/* 로고 텍스트 색깔 및 폰트 */
.logo span{
  color:#0183F4;
  font-family: 'Ria', 'Black Han Sans', 'Noto Sans KR', 'Nanum Gothic', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight: normal; /* Ria 폰트는 이미 ExtraBold이므로 normal 사용 */
  letter-spacing: -0.02em; /* 자간 조정으로 더 세련되게 */
}

.logo-img{
  width:40px;
  height: 40px;
  object-fit:contain
} /* 로고 이미지(정사각/투명 PNG 권장) */

.topbar .logo-badge{
  /* (옵션) 로고 좌측 작은 뱃지/아이콘이 필요할 때 사용 */
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--blue-050);
  flex-shrink:0;
}


.topbar .chip{
  /* 우측 사용자 상태 표시 칩(아바타 + 닉네임) */
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 16px;
  border-radius:24px;
  background:var(--blue-050);
  border:1px solid var(--blue-050);
  flex-shrink: 0;
  min-width: 0;
  /* 클릭 시 마이페이지로 이동하도록 이벤트 연결해도 좋음 */
}

.topbar .avatar{
  /* 사용자 이니셜(첫 글자) 동그라미 */
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  font-weight:700;
  flex-shrink:0;
}

/* 사용자 이름 텍스트 - 모든 페이지에서 일관된 스타일 보장 */
#userName{
  font-size: 14px !important;
  font-weight: 500 !important;
  color: #374151 !important;
  font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif !important;
  line-height: 1.4 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

/* CSS 변수 정의 (헤더에서 사용하는 기본 변수들) */
:root{
  --bg:#f7f8fb;               /* 앱 배경 */
  --card:#ffffff;             /* 카드/섹션 배경 */
  --text:#0f172a;             /* 본문 텍스트 기본색 */
  --muted:#64748b;            /* 보조 텍스트(설명, 캡션) */
  --blue:#246bff;             /* 주요 포인트 컬러 */
  --blue-700:#1e5af2;         /* 포인트 진한 톤 */
  --blue-050:#eef4ff;         /* 포인트 연한 톤 (배경/칩) */
  --green:#11b37c;            /* 성공/완료 포인트 */
  --yellow:#f59e0b;           /* 경고/주의 포인트 */
  --rose:#ef4444;             /* 에러/위험 포인트 */
  --line:#e6e8ee;             /* 경계선/디바이더 */
  --chip:#eef2ff;             /* 칩 배경 */
  --radius-xl:16px;           /* 카드 모서리 라운드 */
  --radius-2xl:22px;          /* 큰 라운드 */
  --shadow:0 6px 24px rgba(15,23,42,0.06); /* 공통 그림자 */

  /* 모바일 웹 표준 여백 시스템 (컨테이너/섹션/카드 간격) */
  --container-padding: 16px;
  --section-gap: 24px;
  --card-gap: 16px;
  --border-radius: 16px;
  --button-height: 48px;
  --icon-size: 24px;
}

/* 기본 스타일 리셋 */
*{
  box-sizing:border-box
}

html,body{
  height:100%;
  margin: 0;
  padding: 0;
}

body{
  /* 앱 전역 폰트 및 매끄러운 렌더링 */
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
</style>
