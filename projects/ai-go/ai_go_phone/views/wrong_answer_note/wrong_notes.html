<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>아이-고 · 오답노트</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <!-- 헤더는 headerLoader.js에서 자동으로 로드됩니다 -->

  <!-- ===== View: List ===== -->
  <section id="view-list" class="page" hidden>
    <div class="panel">
      <div class="panel-head">
        <div class="left">
          <div class="icon-container">
            <div class="icon-circle">
              <span class="icon-x">✖</span>
            </div>
          </div>
          <div class="title-section">
            <div class="main-title">오답노트</div>
            <div class="sub-title">틀린 문제를 다시 학습하세요</div>
          </div>
        </div>
        <div class="total-section">
          <div class="total-text">총 오답 수</div>
          <div class="total-number" id="totalWrong">0</div>
        </div>
      </div>

      <div class="search">
        <div class="inp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7b879b" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3-3"></path></svg>
          <input id="search" placeholder="문제 검색..." />
        </div>
      </div>

      <div class="filter">
        <button id="filterAll">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
          </svg>
          전체
        </button>
      </div>
    </div>

    <div id="listWrap" class="list"></div>
  </section>

  <!-- ===== View: Detail ===== -->
  <section id="view-detail" class="page">

    <!-- 영상 영역 -->
    <div class="sec video">
      <div class="video-container">
        <video 
          id="quizVideo" 
          width="100%" 
          height="100%" 
          controls
          playsinline
          preload="auto"
          style="width: 100%; height: 100%; object-fit: cover; background-color: #000;">
          브라우저가 비디오를 지원하지 않습니다.
        </video>
        <!-- <button class="play-btn" id="playVideo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 3l14 9-14 9V3z"/>
          </svg>
        </button> -->
        <!-- <button class="pause-btn" id="pauseVideo" style="display: none;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button> -->
        
        <!-- 비디오 하단 컨트롤 -->
        <div class="video-controls">
          <div class="control-left">
            <div class="volume-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </div>
            <div class="volume-bar">
              <div class="volume-fill"></div>
            </div>
          </div>
          <div class="control-right">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 문제 설명 -->
    <div class="sec problem-desc">
      <h3>키워드</h3>
      <div class="problem-category" id="dCategory"></div>
    </div>

    <!-- 문제 영역 -->
    <div class="question-section">
      <div class="question-header">
        <h2 class="question-number" id="dNo">문제 1</h2>
      </div>
      <div class="question-content">
        <div class="question-text" id="dAsk">안전한 차간 간격을 위한 올바른 순서는?</div>
        <div class="options" id="dOpts">
          <!-- 옵션들이 동적으로 생성됩니다 -->
        </div>
        
        <!-- 정답/오답 해설 영역 -->
        <div class="answer-explanation" id="answerExplanation" style="display: none;">
          <div id="explainWrap"></div>
        </div>
      </div>
    </div>

      <h3>AI 추천 유사 문제</h3>
      <button class="pill green">
        <div><div class="name">쉬움</div><div class="desc">스쿨존에서 어린이가 뛰어나올 때 대처 방법은?</div></div>
        <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>

        <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
      <button class="pill rose">
        <div><div class="name">어려움</div><div class="desc">빗길에서 미끄러질 수 있는 상황에서 브레이크 조작법?</div></div>
        <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div> -->

    <!-- 뒤로가기 버튼 -->
    <div class="backbar">
      <button id="backToList" class="btn-ghost">← 목록으로 돌아가기</button>
    </div>
  </section>
</div>

<!-- JavaScript 파일 로드 -->
<script src="wrongNotes.js"></script>

<!-- 헤더 로더 스크립트 -->
<script src="../../js/utills/headerLoader.js"></script>
</body>
</html>
