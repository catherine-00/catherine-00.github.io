<style>
  .sg .wrap{padding:14px}
  .sg .panel{background:#fff;border:1px solid var(--line,#e6e8ee);border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.06);padding:16px}
  .sg h1{margin:6px 0 6px;font-size:22px;font-weight:900}
  .sg .sub{color:#6b7a93;font-size:13px;line-height:1.6;margin-bottom:12px}
  .sg .field + .field{margin-top:14px}
  .sg .label{display:flex;align-items:center;gap:8px;font-weight:800;margin:6px 2px 6px;color:#22324d}
  .sg .input{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line,#e6e8ee);border-radius:14px;padding:12px 12px}
  .sg .input input{border:none;outline:none;width:100%;font-size:14px;background:transparent;color:var(--text,#0f172a)}
  .sg .input:focus-within{box-shadow:0 0 0 3px rgba(36,107,255,.18);border-color:#cfe0ff}
  .sg .hint{font-size:12px;color:#8a97aa;margin-top:6px}
  .sg .split{display:flex;gap:8px;align-items:center}
  .sg .split .cell{flex:1;min-width:0}
  .sg .split .cell.small{width:60px !important;flex:0 0 60px !important;min-width:60px !important;max-width:60px !important}
  .sg .split .cell.mid{width:75px !important;flex:0 0 75px !important;min-width:75px !important;max-width:75px !important}
  .sg .split .sep{color:#bec6d6;font-size:13px;font-weight:500;flex-shrink:0}
  .sg .with-right{position:relative}
  .sg .with-right .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:1px solid var(--line,#e6e8ee);background:#fff;display:grid;place-items:center;cursor:pointer}
  .sg .btn-primary{width:100%;margin-top:16px;border:none;border-radius:14px;padding:14px 16px;background:linear-gradient(90deg,#246bff,#1e5af2);color:#fff;font-weight:900;font-size:16px;box-shadow:0 10px 24px rgba(36,107,255,.25);cursor:pointer}
  .sg .terms{margin-top:12px;text-align:center;color:#8d97a9;font-size:12px}
  .sg .terms a{color:#3a63ff;text-decoration:none;font-weight:800}
  .sg .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:30}
  .sg .overlay.show{display:grid}
  .sg .dialog{width:320px;background:#fff;border:1px solid var(--line,#e6e8ee);border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.06);padding:16px;text-align:center}
  .sg .dialog .msg{color:#5a6a85;font-weight:700;margin:10px 0 14px}
  .sg .dialog .ok{display:block;width:100%;border:none;border-radius:12px;padding:12px 16px;background:linear-gradient(90deg,#246bff,#1e5af2);color:#fff;font-weight:900;cursor:pointer}
</style>

<section class="sg">
  <div class="wrap">
    <section class="panel" aria-label="회원가입 양식">
      <h1>계정 만들기</h1>
      <p class="sub">아이-고 회원이 되어 더 많은 기능을 이용하세요</p>

      <form id="signupForm" novalidate>
        <!-- 이름 -->
        <div class="field">
          <div class="label">
            <span class="ic">👤</span> 이름
          </div>
          <label class="input">
            <input id="name" type="text" placeholder="이름을 입력하세요." autocomplete="name" required>
          </label>
        </div>

        <!-- 전화번호 -->
        <div class="field">
          <div class="label">
            <span class="ic">📞</span> 전화번호
          </div>
          <div class="split">
            <div class="cell small">
              <label class="input"><input id="ph1" inputmode="numeric" maxlength="3" placeholder="010"></label>
            </div>
            <span class="sep">-</span>
            <div class="cell mid">
              <label class="input"><input id="ph2" inputmode="numeric" maxlength="4" placeholder="0000"></label>
            </div>
            <span class="sep">-</span>
            <div class="cell mid">
              <label class="input"><input id="ph3" inputmode="numeric" maxlength="4" placeholder="0000"></label>
            </div>
          </div>
        </div>

        <!-- 이메일 -->
        <div class="field">
          <div class="label">
            <span class="ic">✉️</span> 이메일
          </div>
          <div class="split">
            <div class="cell">
              <label class="input"><input id="emailId" type="text" placeholder="admin" autocomplete="email"></label>
            </div>
            <span class="sep">@</span>
            <div class="cell">
              <label class="input"><input id="emailDomain" type="text" placeholder="email.com"></label>
            </div>
          </div>
        </div>

        <!-- 생년월일 -->
        <div class="field">
          <div class="label">
            <span class="ic">📅</span> 생년월일
          </div>
          <div class="split">
            <div class="cell mid">
              <label class="input"><input id="yy" inputmode="numeric" maxlength="4" placeholder="0000"></label>
            </div>
            <span class="sep">년</span>
            <div class="cell small">
              <label class="input"><input id="mm" inputmode="numeric" maxlength="2" placeholder="00"></label>
            </div>
            <span class="sep">월</span>
            <div class="cell small">
              <label class="input"><input id="dd" inputmode="numeric" maxlength="2" placeholder="00"></label>
            </div>
            <span class="sep">일</span>
          </div>
        </div>

        <!-- 비밀번호 -->
        <div class="field">
          <div class="label">
            <span class="ic">🔒</span> 비밀번호 <span class="hint">(8자 이상)</span>
          </div>
          <div class="with-right">
            <label class="input">
              <input id="pw" type="password" placeholder="비밀번호를 입력하세요." minlength="8" required>
            </label>
            <button class="eye" type="button" aria-label="비밀번호 보기" data-toggle="#pw">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="field">
          <div class="label">
            <span class="ic">🔒</span> 비밀번호 확인
          </div>
          <div class="with-right">
            <label class="input">
              <input id="pw2" type="password" placeholder="비밀번호를 다시 입력하세요." minlength="8" required>
            </label>
            <button class="eye" type="button" aria-label="비밀번호 보기" data-toggle="#pw2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">회원가입</button>
        <div class="terms">
          회원가입을 진행하면 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.
        </div>
      </form>
    </section>
  </div>

  <!-- 팝업 -->
  <div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogMsg">
    <div class="dialog">
      <div id="dialogMsg" class="msg">모든 정보를 입력해주세요</div>
      <button id="dialogOk" class="ok" type="button">확인</button>
    </div>
  </div>
</section>
