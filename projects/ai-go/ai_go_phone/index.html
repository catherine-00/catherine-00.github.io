<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
      <title>아이-고</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- 리아체와 유사한 폰트들 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: 'Ria';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/RiaSans-ExtraBold.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }
  </style>
  <style>
    :root{
      --bg:#F9FBFF;
      --line:#e6e8ee;
      --text:#0f172a;
      --blue:#2563ff;
      --blue-050:#eef4ff;
      --shadow:0 8px 28px rgba(15,23,42,.06);
      
      /* 모바일 웹 표준 여백 시스템 */
      --safe-area: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      --container-padding: 16px;
      --section-gap: 24px;
      --card-gap: 16px;
      --border-radius: 16px;
      --button-height: 48px;
      --icon-size: 24px;
    }
    
    *{box-sizing:border-box} 
    
    html,body{
      height:100%;
      margin: 0;
      padding: 0;
    }
    
    body{
      background:var(--bg);
      color:var(--text);
      font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .shell{
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    
    /* 헤더 관련 스타일은 header.html에서 관리됩니다 */
    
    #app{
      flex: 1;
      display: block;
      width: 100%;
    }
    
    /* 라우팅 중 로딩 표시 */
    #loader{
      display: none;
      place-items: center;
      padding: var(--section-gap);
      color: #64748b;
    }
    
    .loading #loader{
      display: grid;
    }
    
    /* 모바일 웹 표준 레이아웃 */
    @media (max-width: 480px) {
      :root {
        --container-padding: 16px;
        --section-gap: 20px;
        --card-gap: 12px;
      }
      
      .topbar {
        padding: 16px var(--container-padding);
      }
      
      .btn {
        width: 40px;
        height: 40px;
      }
    }
    
    @media (min-width: 481px) and (max-width: 768px) {
      :root {
        --container-padding: 24px;
        --section-gap: 32px;
        --card-gap: 20px;
      }
    }
    
    @media (min-width: 769px) {
      :root {
        --container-padding: 32px;
        --section-gap: 40px;
        --card-gap: 24px;
      }
      
      .topbar {
        border-radius: 0 0 var(--border-radius) var(--border-radius);
        margin: 0 var(--container-padding);
        margin-top: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell"> 

    <!-- 헤더는 headerLoader.js에서 자동으로 로드됩니다 -->

    <!-- 드로어(사이드바) -->
    <div id="drawer-root"></div>

    <!-- 라우터가 여기에 그려요 -->
    <main id="app" aria-live="polite"></main>
    <div id="loader">로딩 중…</div>
  </div>

  <!-- 헤더 로더 스크립트 -->
  <script src="./js/utills/headerLoader.js"></script>
  
  <script type="module" src="./js/app.js"></script>

</body>
</html>
